name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build
        run: npm run build

      - name: Verify Cloudflare credentials
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "❌ CLOUDFLARE_API_TOKEN secret is not set in GitHub repository settings"
            exit 1
          fi
          if [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "❌ CLOUDFLARE_ACCOUNT_ID secret is not set in GitHub repository settings"
            exit 1
          fi
          echo "✅ Cloudflare credentials are configured"

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Exact Pages project NAME in Cloudflare (not the *.pages.dev subdomain).
          # This account's project is named "sbm-inc" and serves sbm-inc-ega.pages.dev.
          # Do NOT auto-create projects.
          PAGES_PROJECT_NAME: sbm-inc
        run: |
          npm install -g wrangler

          echo "Verifying Cloudflare authentication..."
          wrangler whoami || (echo "❌ Authentication failed. Check your CLOUDFLARE_API_TOKEN" && exit 1)

          echo "Checking that Pages project '${PAGES_PROJECT_NAME}' already exists..."
          PROJECT_LIST=$(wrangler pages project list)
          echo "$PROJECT_LIST"

          # Match the project NAME column only (e.g. "│ sbm-inc      │"),
          # not domain text like "sbm-inc-ega.pages.dev".
          if ! echo "$PROJECT_LIST" | grep -qE "│ ${PAGES_PROJECT_NAME}[[:space:]]+│"; then
            echo "❌ Expected Pages project '${PAGES_PROJECT_NAME}' was not found in this Cloudflare account."
            echo "Refusing to deploy so we do not create a new/wrong project."
            echo "Confirm the exact project name under Workers & Pages, then update PAGES_PROJECT_NAME in deploy.yml."
            exit 1
          fi

          echo "✅ Found project '${PAGES_PROJECT_NAME}'. Deploying to that project only..."
          wrangler pages deploy out \
            --project-name="${PAGES_PROJECT_NAME}" \
            --branch=${{ github.ref_name }} \
            --commit-hash=${{ github.sha }} \
            --commit-message="${{ github.event.head_commit.message }}" \
            --commit-dirty=true
